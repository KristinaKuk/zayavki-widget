name: Build Windows Widget

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer (NSIS)
        run: npm run tauri build -- --bundles nsis

      - name: Upload Windows installer and executable
        uses: actions/upload-artifact@v4
        with:
          name: zayavki-widget-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/zayavki-widget.exe
          if-no-files-found: error
