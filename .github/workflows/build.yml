name: Build Windows Widget

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer (NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis
          tagName: app-v__VERSION__
          releaseName: 'Заявки Widget v__VERSION__'
          releaseBody: 'Windows build of the corporate requests widget.'
          releaseDraft: true
          prerelease: false

      - name: Upload Windows installer and executable
        uses: actions/upload-artifact@v4
        with:
          name: zayavki-widget-windows
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/zayavki-widget.exe
          if-no-files-found: error
